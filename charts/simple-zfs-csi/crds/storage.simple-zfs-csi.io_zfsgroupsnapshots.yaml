---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: zfsgroupsnapshots.storage.simple-zfs-csi.io
spec:
  group: storage.simple-zfs-csi.io
  names:
    kind: ZfsGroupSnapshot
    listKind: ZfsGroupSnapshotList
    plural: zfsgroupsnapshots
    shortNames:
    - zgsnap
    singular: zfsgroupsnapshot
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolGUID
      name: Pool
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyToUse
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ZfsGroupSnapshot takes one atomic ZFS snapshot over several volumes of one
          pool and owns the member ZfsSnapshots created from it (ADR-0039). The CSI
          controller creates it; the node agent hosting the pool does the work.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ZfsGroupSnapshotSpec is the set of volumes to snapshot at one instant. All
              members live on one pool: a single `zfs snapshot` call commits in one
              transaction group, which is what makes the instant shared. Members and the
              pool are fixed at creation.
            properties:
              members:
                description: Members is the authoritative member list.
                items:
                  description: |-
                    ZfsGroupSnapshotMember is one source volume of a group, recorded before
                    anything is touched (ADR-0039). It carries what the standalone ZfsSnapshot
                    would record, plus the two names this member will use.
                  properties:
                    childSnapshotName:
                      description: |-
                        ChildSnapshotName is the metadata.name of the member's ZfsSnapshot, which
                        is also its CSI snapshot_id.
                      minLength: 1
                      type: string
                    dataset:
                      description: Dataset is the source dataset's logical path relative
                        to the pool root.
                      minLength: 1
                      type: string
                    snapshotName:
                      description: |-
                        SnapshotName is this member's raw ZFS snapshot short name
                        ("csi-snap-<uuid>"), unique per member.
                      minLength: 1
                      type: string
                    sourceFSType:
                      type: string
                    sourceProperties:
                      additionalProperties:
                        type: string
                      type: object
                    sourceType:
                      description: |-
                        SourceType, SourceFSType, SourceVolblocksize and SourceProperties are copied
                        to the child ZfsSnapshot; see the fields of the same name there.
                      enum:
                      - filesystem
                      - volume
                      type: string
                    sourceVolblocksize:
                      type: string
                    sourceVolume:
                      description: SourceVolume is the source ZfsDataset's metadata.name
                        (the CSI volume id).
                      minLength: 1
                      type: string
                  required:
                  - childSnapshotName
                  - dataset
                  - snapshotName
                  - sourceVolume
                  type: object
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: members are immutable
                  rule: self == oldSelf
              poolGUID:
                description: PoolGUID is the ZFS pool GUID hosting every member.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: poolGUID is immutable
                  rule: self == oldSelf
            required:
            - members
            - poolGUID
            type: object
          status:
            description: ZfsGroupSnapshotStatus reports the observed group state.
            properties:
              conditions:
                description: Conditions represents the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              creationTime:
                description: |-
                  CreationTime is the ZFS creation time of one raw snapshot, recorded once
                  after the atomic exec. Maps to CSI VolumeGroupSnapshot.creation_time.
                format: date-time
                type: string
              message:
                description: Message carries human-readable detail about the current
                  phase.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is derived from the member ZfsSnapshots.
                type: string
              provisionedAt:
                description: |-
                  ProvisionedAt is when all member snapshots were first Ready at the same
                  time. Written once; from then on the group creates nothing (ADR-0038).
                format: date-time
                type: string
              readyToUse:
                description: |-
                  ReadyToUse is true while every member is Ready. Maps to CSI
                  VolumeGroupSnapshot.ready_to_use.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
